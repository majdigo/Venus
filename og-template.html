<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }
    
    .noise {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      opacity: 0.15;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .logo-container {
      position: relative;
      z-index: 10;
      margin-bottom: 40px;
      background: white;
      padding: 20px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .logo {
      width: 500px;
      height: auto;
    }

    .title {
      position: relative;
      z-index: 10;
      color: #E2C87A;
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .subtitle {
      position: relative;
      z-index: 10;
      color: #cbd5e1;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 4px;
      text-align: center;
    }
    
    .accent-line {
      position: relative;
      z-index: 10;
      width: 150px;
      height: 4px;
      background: linear-gradient(90deg, transparent, #D4AF37, transparent);
      margin: 40px 0;
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="glow"></div>
  
  <div class="logo-container">
    <img src="https://venus-estetika.com/wp-content/uploads/2024/01/cropped-logo_sans_blanc1.png" class="logo" />
  </div>
  
  <div class="title">Chirurgie Esthétique en Tunisie</div>
  <div class="accent-line"></div>
  <div class="subtitle">SÉJOUR MÉDICAL TOUT COMPRIS 5★</div>
  
</body>
</html>
