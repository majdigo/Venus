<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C87A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Background Sparkles -->
  <circle cx="130" cy="110" r="3" fill="url(#gold)" opacity="0.6"/>
  <circle cx="270" cy="80" r="2" fill="url(#gold)" opacity="0.8"/>
  <circle cx="310" cy="210" r="1.5" fill="url(#gold)" opacity="0.5"/>
  
  <g transform="translate(150, 60)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Abstract Stomach Shape -->
    <path d="M 40,20 C 10,20 10,60 10,90 C 10,130 30,170 70,170 C 110,170 120,130 120,80 C 120,30 90,0 70,20" stroke="#0f172a" opacity="0.9"/>
    
    <!-- Esophagus/Intestine -->
    <path d="M 60,-20 L 60,18" stroke="#0f172a" opacity="0.6"/>
    <path d="M 80,165 L 80,200" stroke="#0f172a" opacity="0.6"/>
    
    <!-- Sleeve Gastrectomy Outline (Golden cut) -->
    <path d="M 50,15 C 30,50 30,120 70,165" stroke="url(#gold)" stroke-dasharray="4 6" opacity="0.9"/>
    
    <!-- Weight Loss Down Arrow inside -->
    <path d="M 80,60 L 80,110 M 80,110 L 70,95 M 80,110 L 90,95" stroke="url(#gold)" stroke-width="2.5" opacity="0.8"/>
  </g>
</svg>
