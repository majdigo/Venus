<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C87A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Background Sparkles -->
  <circle cx="100" cy="100" r="2.5" fill="url(#gold)" opacity="0.7"/>
  <circle cx="300" cy="80" r="1.5" fill="url(#gold)" opacity="0.5"/>
  <circle cx="280" cy="240" r="2" fill="url(#gold)" opacity="0.8"/>
  
  <g transform="translate(140, 60)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Body / Shoulders -->
    <path d="M 10,30 C 50,30 70,70 70,110 C 70,150 40,180 40,200" stroke="#0f172a" opacity="0.9"/>
    <path d="M 110,30 C 70,30 50,70 50,110 C 50,150 80,180 80,200" stroke="#0f172a" opacity="0.9"/>
    
    <!-- Breast Curves with Gold Accent -->
    <path d="M 30,130 C 30,160 50,170 60,170" stroke="url(#gold)" opacity="0.9"/>
    <path d="M 90,130 C 90,160 70,170 60,170" stroke="url(#gold)" opacity="0.9"/>
    
    <!-- Symmetry Axis line -->
    <line x1="60" y1="20" x2="60" y2="200" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
    
    <!-- Measurement indicators -->
    <path d="M 15,145 L 25,145 M 95,145 L 105,145" stroke="url(#gold)" stroke-width="2"/>
  </g>
</svg>
