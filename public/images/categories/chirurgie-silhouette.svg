<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C87A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Background Sparkles -->
  <circle cx="110" cy="130" r="3" fill="url(#gold)" opacity="0.6"/>
  <circle cx="280" cy="190" r="2" fill="url(#gold)" opacity="0.8"/>
  <circle cx="310" cy="90" r="1.5" fill="url(#gold)" opacity="0.5"/>
  
  <g transform="translate(150, 40)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Hourglass Body Contour (Left) -->
    <path d="M 20,20 C 40,70 10,120 10,160 C 10,200 40,240 40,240" stroke="#0f172a" opacity="0.9"/>
    <!-- Hourglass Body Contour (Right) -->
    <path d="M 80,20 C 60,70 90,120 90,160 C 90,200 60,240 60,240" stroke="#0f172a" opacity="0.9"/>
    
    <!-- Refined Gold Accent Curves (Waist/Hips) -->
    <path d="M 22,80 C 5,120 15,170 30,210" stroke="url(#gold)" stroke-width="2" opacity="0.8" stroke-dasharray="5 5"/>
    <path d="M 78,80 C 95,120 85,170 70,210" stroke="url(#gold)" stroke-width="2" opacity="0.8" stroke-dasharray="5 5"/>
    
    <!-- Center Line -->
    <line x1="50" y1="20" x2="50" y2="240" stroke="#0f172a" stroke-width="1.5" opacity="0.2"/>
    <circle cx="50" cy="120" r="2" fill="url(#gold)" stroke="none"/>
  </g>
</svg>
