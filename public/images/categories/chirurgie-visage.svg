<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C87A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <!-- Background Sparkles -->
  <circle cx="120" cy="80" r="2" fill="url(#gold)" opacity="0.6"/>
  <circle cx="280" cy="90" r="3" fill="url(#gold)" opacity="0.8"/>
  <circle cx="290" cy="220" r="1.5" fill="url(#gold)" opacity="0.5"/>
  
  <g transform="translate(130, 40)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Abstract Face Profile -->
    <path d="M 50,10 C 20,40 30,80 30,120 C 30,160 50,190 70,220 C 90,250 120,250 120,250" stroke="#0f172a" opacity="0.9"/>
    <!-- Nose / Lips Contour Detail -->
    <path d="M 30,120 C 10,140 10,160 30,170 C 25,180 30,190 40,195" stroke="url(#gold)" opacity="0.9"/>
    <!-- Eye Line -->
    <path d="M 50,90 Q 70,80 90,90" stroke="#0f172a" opacity="0.6"/>
    <!-- Golden Lift Arrow -->
    <path d="M 120,130 L 140,100 M 140,100 L 120,95 M 140,100 L 145,120" stroke="url(#gold)" stroke-width="2"/>
  </g>
</svg>
